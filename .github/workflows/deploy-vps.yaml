name: Deploy production VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: production-vps
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    name: Verify and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Check out the release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run lint checks
        run: npm run lint

      - name: Verify static serving and timing-log privacy
        run: node scripts/verify-caddy-performance.mjs

      - name: Validate map cache service units
        run: sh scripts/verify-map-cache-units.sh

      - name: Run type checks
        run: npm run typecheck

      - name: Validate the Open-Meteo relay runtimes
        run: |
          npm run worker:check
          npm run lambda:check

      - name: Validate production build configuration
        env:
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          set -eu
          test -n "$NEXT_PUBLIC_UMAMI_WEBSITE_ID"
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          test -n "$NEXT_PUBLIC_TURNSTILE_SITE_KEY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse an image already published for this commit
        id: existing_image
        env:
          IMAGE_TAG: ghcr.io/neptrino/bolets:${{ github.sha }}
        run: |
          set -eu
          if digest=$(docker buildx imagetools inspect "$IMAGE_TAG" --format '{{.Manifest.Digest}}'); then
            printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
            printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          else
            # The package/tag may not exist on the first run. Authentication
            # or registry failures still fail the required build/push below.
            echo 'No reusable image found; building the commit'
          fi

      - name: Build and publish the production image
        id: image
        if: steps.existing_image.outputs.digest == ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # Git context builds exactly the archived commit, ignoring local
          # generated files from the preceding checks.
          context: "{{defaultContext}}"
          platforms: linux/amd64
          push: true
          tags: ghcr.io/neptrino/bolets:${{ github.sha }}
          build-args: |
            BOLETS_REVISION=${{ github.sha }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            SUPPORT_URL=${{ vars.SUPPORT_URL }}
          cache-from: type=registry,ref=ghcr.io/neptrino/bolets:buildcache
          cache-to: type=registry,ref=ghcr.io/neptrino/bolets:buildcache,mode=max

      - name: Smoke-test the published image
        env:
          BOLETS_APP_IMAGE: ghcr.io/neptrino/bolets@${{ steps.existing_image.outputs.digest || steps.image.outputs.digest }}
        run: |
          set -eu
          docker pull "$BOLETS_APP_IMAGE"
          trap 'docker rm -f bolets-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name bolets-smoke -p 127.0.0.1:3102:3000 "$BOLETS_APP_IMAGE"
          curl --fail --silent --show-error --retry 12 --retry-delay 2 --retry-all-errors \
            --max-time 5 http://127.0.0.1:3102/api/health | jq -e '.status == "ok"'

      - name: Deploy the Open-Meteo relay Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -eu
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npm run worker:deploy

      - name: Configure temporary AWS deployment credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ vars.AWS_LAMBDA_REGION }}
          role-to-assume: ${{ vars.AWS_LAMBDA_DEPLOY_ROLE_ARN }}

      - name: Deploy an immutable Open-Meteo Lambda relay version
        env:
          AWS_LAMBDA_RELAY_BASE_URL: ${{ vars.AWS_LAMBDA_RELAY_BASE_URL }}
        run: |
          set -eu
          test -n "$AWS_LAMBDA_RELAY_BASE_URL"
          relay_archive="$RUNNER_TEMP/bolets-open-meteo-relay.zip"
          (cd lambda/open-meteo-relay/dist && zip -q "$relay_archive" index.js)
          aws lambda update-function-code \
            --function-name bolets-open-meteo-relay-aws \
            --zip-file "fileb://$relay_archive" \
            --architectures arm64 \
            >/dev/null
          aws lambda wait function-updated \
            --function-name bolets-open-meteo-relay-aws
          relay_version="$(aws lambda publish-version \
            --function-name bolets-open-meteo-relay-aws \
            --description "GitHub ${GITHUB_SHA}" \
            --query Version \
            --output text)"
          aws lambda update-alias \
            --function-name bolets-open-meteo-relay-aws \
            --name live \
            --function-version "$relay_version" \
            >/dev/null
          curl --fail --silent --show-error --retry 3 \
            "${AWS_LAMBDA_RELAY_BASE_URL}health" \
            | jq -e '.ok == true' >/dev/null

      - name: Create the immutable release archive
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/bolets-release.tar.gz" "$GITHUB_SHA"

      - name: Configure the deployment identity
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -eu
          test -n "$VPS_KNOWN_HOSTS"
          test -n "$VPS_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/bolets-deploy"
          chmod 600 "$HOME/.ssh/known_hosts" "$HOME/.ssh/bolets-deploy"
          ssh-keygen -y -f "$HOME/.ssh/bolets-deploy" >/dev/null

      - name: Deploy the tested commit
        env:
          BOLETS_APP_IMAGE: ghcr.io/neptrino/bolets@${{ steps.existing_image.outputs.digest || steps.image.outputs.digest }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          {
            # The receiver keeps registry credentials in a temporary root-only
            # Docker config, never in the immutable release or command line.
            printf '%s\n' ghcr-v1 "$GITHUB_SHA" "$BOLETS_APP_IMAGE" "$GHCR_USERNAME" "$GHCR_TOKEN"
            cat "$RUNNER_TEMP/bolets-release.tar.gz"
          } | ssh \
            -i "$HOME/.ssh/bolets-deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            bolets-deploy@51.255.40.179
