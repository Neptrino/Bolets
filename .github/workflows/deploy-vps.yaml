name: Deploy production VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-vps
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    name: Verify and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Check out the release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run lint checks
        run: npm run lint

      - name: Verify static serving and timing-log privacy
        run: node scripts/verify-caddy-performance.mjs

      - name: Validate map cache service units
        run: sh scripts/verify-map-cache-units.sh

      - name: Run type checks
        run: npm run typecheck

      - name: Validate the Open-Meteo relay runtimes
        run: |
          npm run worker:check
          npm run lambda:check

      - name: Build the production application
        env:
          # This identifier is public and must match the VPS Umami bootstrap.
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ce97249f-b2de-44bd-899c-56f8fc05cb54
        run: npm run build

      - name: Deploy the Open-Meteo relay Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -eu
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npm run worker:deploy

      - name: Configure temporary AWS deployment credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ vars.AWS_LAMBDA_REGION }}
          role-to-assume: ${{ vars.AWS_LAMBDA_DEPLOY_ROLE_ARN }}

      - name: Deploy an immutable Open-Meteo Lambda relay version
        env:
          AWS_LAMBDA_RELAY_BASE_URL: ${{ vars.AWS_LAMBDA_RELAY_BASE_URL }}
        run: |
          set -eu
          test -n "$AWS_LAMBDA_RELAY_BASE_URL"
          relay_archive="$RUNNER_TEMP/bolets-open-meteo-relay.zip"
          (cd lambda/open-meteo-relay/dist && zip -q "$relay_archive" index.js)
          aws lambda update-function-code \
            --function-name bolets-open-meteo-relay-aws \
            --zip-file "fileb://$relay_archive" \
            --architectures arm64 \
            >/dev/null
          aws lambda wait function-updated \
            --function-name bolets-open-meteo-relay-aws
          relay_version="$(aws lambda publish-version \
            --function-name bolets-open-meteo-relay-aws \
            --description "GitHub ${GITHUB_SHA}" \
            --query Version \
            --output text)"
          aws lambda update-alias \
            --function-name bolets-open-meteo-relay-aws \
            --name live \
            --function-version "$relay_version" \
            >/dev/null
          curl --fail --silent --show-error --retry 3 \
            "${AWS_LAMBDA_RELAY_BASE_URL}health" \
            | jq -e '.ok == true' >/dev/null

      - name: Create the immutable release archive
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/bolets-release.tar.gz" "$GITHUB_SHA"

      - name: Configure the deployment identity
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -eu
          test -n "$VPS_KNOWN_HOSTS"
          test -n "$VPS_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/bolets-deploy"
          chmod 600 "$HOME/.ssh/known_hosts" "$HOME/.ssh/bolets-deploy"
          ssh-keygen -y -f "$HOME/.ssh/bolets-deploy" >/dev/null

      - name: Deploy the tested commit
        run: |
          set -eu
          {
            printf '%s\n' "$GITHUB_SHA"
            cat "$RUNNER_TEMP/bolets-release.tar.gz"
          } | ssh \
            -i "$HOME/.ssh/bolets-deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            bolets-deploy@51.255.40.179
